---
# update-secure-ubuntu.yml
# Standardize Ubuntu security patching with Ansible.
# Author: Derek Asamoah-Amoyaw

- name: Patch and secure Ubuntu servers
  hosts: ubuntu_servers
  become: true
  gather_facts: true

  tasks:
    - name: Refresh APT cache and upgrade installed packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Ensure unattended-upgrades is installed
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Enable periodic package-list refresh
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/20auto-upgrades
        regexp: '^APT::Periodic::Update-Package-Lists'
        line: 'APT::Periodic::Update-Package-Lists "1";'
        create: true
        mode: '0644'

    - name: Enable automatic unattended upgrades
      ansible.builtin.lineinfile:
        path: /etc/apt/apt.conf.d/20auto-upgrades
        regexp: '^APT::Periodic::Unattended-Upgrade'
        line: 'APT::Periodic::Unattended-Upgrade "1";'
        create: true
        mode: '0644'

    - name: Check whether Ubuntu requires a reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot only when required
      ansible.builtin.reboot:
        msg: "Reboot triggered by Ansible after package updates"
        reboot_timeout: 900
      when: reboot_required.stat.exists
